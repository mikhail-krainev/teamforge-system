          - "https://research.google.com/pubs/archive/aad9f93b86b7addfea4c419b9100c6cdd26cacea.pdf"
      - key: m6_model_card
        title: "Model card"
        description: "Назначение, неподдерживаемые применения, данные, метрики, ограничения."
        type: artifact
