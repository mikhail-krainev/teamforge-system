      - key: m7_api_review
        title: "Ревью API командой"
        description: "Созвон 1 ч."
        type: ritual
        ritual_kind: call
        required: true
        owner_role: any
        fallback: null
        review_checklist: false
        auto_checks: ["ritual_fields"]
        sources:
          - "https://developers.google.com/machine-learning/guides/rules-of-ml"
