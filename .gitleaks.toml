# gitleaks configuration: default rules plus an allowlist for public test constants.
title = "teamforge"

[extend]
useDefault = true

[[allowlists]]
description = "Public throwaway credentials of the local test stack and test fixtures (never real secrets)"
paths = [
  '''(^|/)\.env\.test$''',
  '''(^|/)docker-compose\.test\.yml$''',
]

[[allowlists]]
description = "Step identifier in docs/playbooks.md that looks like a key (false positive)"
regexes = ['''m6_evaluation''']

[[allowlists]]
description = "Fake cancellation token in a web unit test (false positive)"
regexes = ['''cancel0123456789abcdef''']

[[allowlists]]
description = "Fake invitation token in web unit tests (alphabet sequence, false positive)"
regexes = ['''abcdefghij0123456789ABCDEFGHIJ-_abcdefghijK''']

[[allowlists]]
description = "Fake keys and secrets of the API test helpers and integration tests (exact values; never real secrets)"
regexes = [
  '''^k3Jd9sLq0Zx7Vb2Nm5Ra8Tw1Yp4Hc6Ug$''',
  '''^0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef$''',
  '''^0b9f3c1e-5d2a-4f6b-8a7c-1e2d3c4b5a69$''',
  '''^f3a2a8f0-0c1e-4f4e-9d52-7a2d6b0a9c10$''',
  '''^wrong-secret-key-0123456789$''',
]
